name: event-command-center
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: event_center
      POSTGRES_USER: ecc_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create .env with scripts/init_env.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecc_app -d event_center"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: event_center
      DB_USER: ecc_app
      DB_PASSWORD: ${DB_PASSWORD:?Create .env with scripts/init_env.py}
      DB_HOST: db
      DB_PORT: '5432'
      PHOTO_DATA_ROOT: /data/photos
      APP_ACTOR: local-operator
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Create .env with scripts/init_env.py}
      OPERATOR_PROXY_KEY: ${OPERATOR_PROXY_KEY:?Create .env with scripts/init_env.py}
      GUEST_SITE_URL: ${GUEST_SITE_URL:-http://127.0.0.1:8080/}
      DASHBOARD_URL: http://127.0.0.1:8081/
    volumes:
      - photo_data:/data/photos
    restart: unless-stopped
  web:
    image: nginx:stable-alpine
    depends_on:
      - app
    environment:
      OPERATOR_PROXY_KEY: ${OPERATOR_PROXY_KEY:?Create .env with scripts/init_env.py}
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - '127.0.0.1:8080:8080'  # Public guest routes only; initially localhost-only
      - '127.0.0.1:8081:8081'  # Private operator dashboard; never expose via Funnel
    restart: unless-stopped
volumes:
  postgres_data:
  photo_data:
